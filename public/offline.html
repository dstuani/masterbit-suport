<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex">
  <title>Sem conexão · Masterbit Suport</title>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0; min-height: 100dvh; display: grid; place-items: center; padding: 1.5rem;
      background: #faf9f7; color: #1c1917;
      font-family: system-ui, -apple-system, "Segoe UI", sans-serif; line-height: 1.55;
    }
    main { width: min(26rem, 100%); background: #fff; border: 1px solid #e7e5e4; border-radius: 12px; padding: 1.75rem; border-top: 6px solid #f47b36; }
    h1 { margin: 0 0 .5rem; font-size: 1.25rem; }
    p { margin: 0 0 1.25rem; color: #57534e; }
    button {
      font: inherit; font-weight: 600; cursor: pointer; border: 0; border-radius: 8px;
      background: #c4561b; color: #fff; padding: .7rem 1.2rem;
    }
    button:focus-visible { outline: 3px solid #c4561b; outline-offset: 3px; }
  </style>
</head>
<body>
  <main>
    <h1>Sem conexão com a internet</h1>
    <p>O Masterbit Suport precisa de internet para mostrar os atendimentos. Confira a conexão e tente de novo.</p>
    <button type="button" onclick="location.reload()">Tentar de novo</button>
  </main>
</body>
</html>
